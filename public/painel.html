<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Exibição - Chamada de Senhas</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

      :root {
        --text-primary: #1e293b;
        --primary: #2563eb;
        --primary-light: #eff6ff;
        --bg-secondary: #ffffff;
        --border-color: #cbd5e1;
        --radius-sm: 0.375rem;
        --radius-md: 0.5rem;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        --transition: all 0.3s ease;
        --font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }

      body {
        font-family: var(--font-family);
        background-color: #f1f5f9;
        color: var(--text-primary);
        height: 100vh;
        overflow: hidden;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
      }

      /* Status Badges */
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.75rem;
        border-radius: var(--radius-sm);
        font-size: 0.875rem;
        font-weight: 600;
      }

      .badge-normal {
        background-color: var(--primary-light);
        color: var(--primary);
      }

      /* TELA DE BLOQUEIO PARA ATIVAR ÁUDIO CROSS-BROWSER */
      #audio-unlocker {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.95);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
      }
      #audio-unlocker button {
        padding: 1rem 2.5rem;
        font-size: 1.5rem;
        font-weight: bold;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: background 0.2s;
        box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      }
      #audio-unlocker button:hover {
        background: #1d4ed8;
      }

      .panel-container {
        display: grid;
        grid-template-columns: 7fr 3fr;
        flex: 1;
        width: 100%;
      }
      .main-call {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 3rem;
        border-right: 2px solid #e2e8f0;
        text-align: center;
        position: relative;
        background: radial-gradient(circle at center, #ffffff 0%, #f1f5f9 100%);
      }
      .call-title {
        font-size: 2rem;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 4px;
        margin-bottom: 2rem;
      }
      .current-code {
        font-size: 10rem;
        font-weight: 900;
        color: var(--primary);
        line-height: 1;
        margin-bottom: 1.5rem;
        letter-spacing: -2px;
        text-shadow: 0 4px 30px rgba(37, 99, 235, 0.15);
      }
      .current-details {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .current-service {
        font-size: 2.5rem;
        font-weight: 700;
        color: #475569;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .current-desk {
        font-size: 3.5rem;
        font-weight: 800;
        color: var(--primary);
        background: var(--primary-light);
        border: 2px solid var(--primary);
        padding: 0.5rem 2.5rem;
        border-radius: var(--radius-md);
        display: inline-block;
        margin-top: 1rem;
        box-shadow: var(--shadow-md);
      }

      .history-panel {
        background-color: #e2e8f0;
        display: flex;
        flex-direction: column;
        padding: 2rem;
        border-left: 1px solid #cbd5e1;
      }
      .history-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #475569;
        text-transform: uppercase;
        letter-spacing: 2px;
        border-bottom: 2px solid #cbd5e1;
        padding-bottom: 1rem;
        margin-bottom: 1.5rem;
        text-align: center;
      }
      .history-list {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        overflow-y: auto;
      }
      .history-item {
        background-color: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: var(--radius-md);
        padding: 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: var(--shadow-sm);
        transition: var(--transition);
      }
      .history-code {
        font-size: 2.25rem;
        font-weight: 800;
        color: var(--text-primary);
      }
      .history-info {
        text-align: right;
      }
      .history-desk {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--primary);
      }
      .history-service {
        font-size: 0.8rem;
        color: #475569;
        text-transform: uppercase;
        margin-top: 0.25rem;
      }

      .panel-header {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 150px;
        padding: 0 3rem;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
        z-index: 10;
        box-shadow: var(--shadow-sm);
      }
      .audio-config {
        position: absolute;
        bottom: 1rem;
        left: 1rem;
        z-index: 10;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        padding: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
        cursor: pointer;
        max-width: 2.2rem;
        overflow: hidden;
        transition:
          max-width 0.3s cubic-bezier(0.4, 0, 0.2, 1),
          padding 0.3s ease,
          background-color 0.3s ease;
        white-space: nowrap;
        box-shadow: var(--shadow-md);
        color: var(--text-primary);
      }
      .audio-config:hover {
        max-width: 20rem;
        padding: 0.5rem 1rem;
        background: var(--bg-secondary);
        border-color: var(--primary);
      }
    </style>
  </head>
  <body>
    <div id="audio-unlocker">
      <h2 style="margin-bottom: 2rem">Sistema de Painel de Senhas</h2>
      <button id="btn-start-panel">Iniciar Painel (Ativar Áudio)</button>
      <p style="margin-top: 1rem; font-size: 0.9rem; color: #cbd5e1">
        O clique é necessário para liberar o som no navegador.
      </p>
    </div>

    <div
      class="panel-header"
      style="
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 150px;
        padding: 0px 3rem;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
      "
    >
      <div class="logo" style="display: flex; align-items: center; gap: 12px">
        <img
          src="assets/img/Group.svg"
          alt="Logo Defensoria"
          style="height: 7rem; width: auto; object-fit: contain"
        />
        <span
          style="
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.8rem;
          "
          >Defensoria Pública do Estado do Pará</span
        >
      </div>
      <div
        style="
          text-align: right;
          display: flex;
          flex-direction: column;
          align-items: flex-end;
          gap: 2px;
        "
      >
        <div
          class="badge badge-normal"
          id="clock"
          style="
            line-height: 1;
            font-size: 1.75rem"
        >
          00:00:00
        </div>
        <div
          id="day-of-week"
          style="
            font-size: 1.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: capitalize;
          "
        ></div>
      </div>
    </div>

    <main class="panel-container">
      <section class="main-call" aria-live="assertive" aria-atomic="true">
        <label class="audio-config">
          <input type="checkbox" id="enable-sound" checked />
          <span>Habilitar chamada por voz (Áudio)</span>
        </label>

        <div class="call-title">Senha Chamada</div>
        <div class="current-code" id="current-code">---</div>

        <div class="current-details">
          <div class="current-service" id="current-service">
            Aguardando início...
          </div>
          <div>
            <span class="current-desk" id="current-desk">GUICHÊ --</span>
          </div>
        </div>
      </section>

      <aside class="history-panel">
        <div class="history-title">Últimas Chamadas</div>
        <div class="history-list" id="history-list" aria-live="polite">
          <div style="text-align: center; color: #4b5563; margin-top: 3rem">
            Sem chamadas anteriores.
          </div>
        </div>
      </aside>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
      let displayQueue = [];
      let isDisplaying = false;
      let audioCtx; // Contexto de áudio global
      let audioUnlocked = false;
      let systemVoices = [];

      // 1. Feature Detection e Inicialização Segura de Vozes
      if ("speechSynthesis" in window) {
        // Carrega vozes de forma assíncrona (Necessário no Chrome)
        const loadVoices = () => {
          systemVoices = window.speechSynthesis.getVoices();
        };
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();
      }

      // 2. Destravamento de Áudio Cross-Browser (Evento do Usuário)
      document
        .getElementById("btn-start-panel")
        .addEventListener("click", () => {
          // Inicializa AudioContext (cross-browser)
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();

          // Retira de "suspended" se necessário (Crucial para Safari)
          if (audioCtx.state === "suspended") {
            audioCtx.resume();
          }

          // Toca algo silencioso apenas para destravar o motor de voz (Crucial para Chrome/Firefox)
          if ("speechSynthesis" in window) {
            const unlockUtterance = new SpeechSynthesisUtterance("");
            unlockUtterance.volume = 0;
            window.speechSynthesis.speak(unlockUtterance);
          }

          audioUnlocked = true;
          document.getElementById("audio-unlocker").style.display = "none";
        });

      function processDisplayQueue() {
        if (isDisplaying || displayQueue.length === 0) return;

        isDisplaying = true;
        const { ticket, desk } = displayQueue.shift();

        document.getElementById("current-code").textContent = ticket.code;

        let serviceLabel = "Vara de Família";
        if (ticket.service === "criminal") serviceLabel = "Vara Criminal";
        if (ticket.service === "execucao-penal")
          serviceLabel = "Execução Penal";

        let typeLabel = "Comum";
        if (ticket.type === "prioridade") typeLabel = "Preferencial";
        if (ticket.type === "superprioridade") typeLabel = "Superprioridade";
        document.getElementById("current-service").textContent =
          `${serviceLabel} - ${typeLabel}`;

        document.getElementById("current-desk").textContent = `GUICHÊ ${desk}`;

        animateCall();

        if (audioUnlocked && document.getElementById("enable-sound").checked) {
          playChime();
          announceTicket(ticket, desk);
        }

        setTimeout(() => {
          isDisplaying = false;
          processDisplayQueue();
        }, 8000);
      }

      function updateClock() {
        const now = new Date();
        document.getElementById("clock").textContent =
          now.toLocaleTimeString("pt-BR");
        const options = { weekday: "long" };
        document.getElementById("day-of-week").textContent =
          now.toLocaleDateString("pt-BR", options);
      }
      setInterval(updateClock, 1000);
      updateClock();

      function animateCall() {
        const mainCall = document.querySelector(".main-call");
        mainCall.style.backgroundColor = "#1e293b";
        setTimeout(() => {
          mainCall.style.backgroundColor = "";
        }, 500);
      }

      // 3. AudioContext Refatorado para Resiliência
      function playChime() {
        if (!audioCtx) return;
        try {
          if (audioCtx.state === "suspended") audioCtx.resume();

          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();

          osc1.connect(gainNode);
          osc2.connect(gainNode);
          gainNode.connect(audioCtx.destination);

          osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime);

          gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
          gainNode.gain.linearRampToValueAtTime(
            0.3,
            audioCtx.currentTime + 0.1,
          );
          gainNode.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 1.2,
          );

          osc1.start(audioCtx.currentTime);
          osc2.start(audioCtx.currentTime);

          setTimeout(() => {
            const osc3 = audioCtx.createOscillator();
            const osc4 = audioCtx.createOscillator();
            const gainNode2 = audioCtx.createGain();

            osc3.connect(gainNode2);
            osc4.connect(gainNode2);
            gainNode2.connect(audioCtx.destination);

            osc3.frequency.setValueAtTime(392.0, audioCtx.currentTime);
            osc4.frequency.setValueAtTime(493.88, audioCtx.currentTime);

            gainNode2.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode2.gain.linearRampToValueAtTime(
              0.3,
              audioCtx.currentTime + 0.1,
            );
            gainNode2.gain.exponentialRampToValueAtTime(
              0.001,
              audioCtx.currentTime + 1.2,
            );

            osc3.start(audioCtx.currentTime);
            osc4.start(audioCtx.currentTime);

            osc3.stop(audioCtx.currentTime + 1.2);
            osc4.stop(audioCtx.currentTime + 1.2);
          }, 300);

          osc1.stop(audioCtx.currentTime + 1.5);
          osc2.stop(audioCtx.currentTime + 1.5);
        } catch (e) {
          console.error("Web Audio falhou:", e);
        }
      }

      // 4. Seleção Inteligente de Voz pt-BR
      function announceTicket(ticket, desk) {
        if (!("speechSynthesis" in window)) return;

        setTimeout(() => {
          let serviceText = "Vara de Família";
          if (ticket.service === "criminal") serviceText = "Vara Criminal";
          if (ticket.service === "execucao-penal")
            serviceText = "Execução Penal";

          let typeText = "Normal";
          if (ticket.type === "prioridade") typeText = "Prioritária";
          if (ticket.type === "superprioridade") typeText = "Superprioridade";

          const spelledCode = ticket.code
            .split("")
            .map((char) => (char === "-" ? " " : char))
            .join(" ");

          const text = `Senha, ${spelledCode}. ${serviceText}, ${typeText}. No guichê ${desk}.`;
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = "pt-BR";
          utterance.rate = 0.9;

          // Filtra explicitamente por uma voz brasileira disponível no SO atual
          const ptVoice = systemVoices.find(
            (v) => v.lang.replace("_", "-") === "pt-BR",
          );
          if (ptVoice) utterance.voice = ptVoice;

          window.speechSynthesis.speak(utterance);
        }, 1500);
      }

      function updateDisplay(state) {
        const current = state.currentTicket;
        if (current && !isDisplaying) {
          document.getElementById("current-code").textContent = current.code;

          let serviceLabel = "Vara de Família";
          if (current.service === "criminal") serviceLabel = "Vara Criminal";
          if (current.service === "execucao-penal")
            serviceLabel = "Execução Penal";

          let typeLabel = "Comum";
          if (current.type === "prioridade") typeLabel = "Preferencial";
          if (current.type === "superprioridade") typeLabel = "Superprioridade";
          document.getElementById("current-service").textContent =
            `${serviceLabel} - ${typeLabel}`;
          document.getElementById("current-desk").textContent =
            `GUICHÊ ${current.desk}`;
        }

        const historyListEl = document.getElementById("history-list");
        if (state.history && state.history.length > 0) {
          historyListEl.innerHTML = state.history
            .map((item) => {
              let serviceName = "Família";
              if (item.service === "criminal") serviceName = "Criminal";
              if (item.service === "execucao-penal")
                serviceName = "Exec. Penal";

              return `
             <div class="history-item">
               <div class="history-code">${item.code}</div>
               <div class="history-info">
                 <div class="history-desk">Guichê ${item.desk}</div>
                 <div class="history-service">${serviceName} - ${item.type === "superprioridade" ? "Super" : item.type === "prioridade" ? "Pref" : "Comum"}</div>
               </div>
             </div>
           `;
            })
            .join("");
        } else {
          historyListEl.innerHTML = `<div style="text-align: center; color: #4b5563; margin-top: 3rem;">Sem chamadas anteriores.</div>`;
        }
      }

      // Presumindo que estas funções estão definidas no seu app.js
      if (typeof getState === "function") {
        const initialState = getState();
        updateDisplay(initialState);
      }

      if (typeof subscribeToUpdates === "function") {
        subscribeToUpdates((state) => {
          updateDisplay(state);
        });
      }

      if (typeof socket !== "undefined") {
        socket.on("CALL_TICKET", ({ ticket, desk }) => {
          displayQueue.push({ ticket, desk });
          processDisplayQueue();
          updateDisplay(getState());
        });

        socket.on("RECALL_TICKET", ({ ticket, desk }) => {
          displayQueue.push({ ticket, desk });
          processDisplayQueue();
        });
      }

      if (typeof channel !== "undefined") {
        channel.onmessage = (event) => {
          if (event.data) {
            if (
              typeof socket !== "undefined" &&
              (event.data.type === "CALL_TICKET" ||
                event.data.type === "RECALL_TICKET")
            ) {
              return;
            }

            if (event.data.type === "CALL_TICKET") {
              const { ticket, desk } = event.data;
              displayQueue.push({ ticket, desk });
              processDisplayQueue();
              updateDisplay(getState());
            } else if (event.data.type === "RECALL_TICKET") {
              const { ticket, desk } = event.data;
              displayQueue.push({ ticket, desk });
              processDisplayQueue();
            } else if (event.data.type === "STATE_UPDATED") {
              updateDisplay(event.data.state);
            }
          }
        };
      }
    </script>
  </body>
</html>
